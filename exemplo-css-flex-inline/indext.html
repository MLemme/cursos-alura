<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exemplo</title>
</head>
<body>
    <h2>Diferença entre display flex e inline-flex</h2>

    <h3>display: flex</h3>
    <p>display flex exibe elementos em nível de bloco.</p>
    <div class="container-flex">
    <div class="flex-child"></div>
    </div>

    <div class="container-flex">
    <div class="flex-child"></div>
    </div>

    <div class="container-flex">
    <div class="flex-child"></div>
    </div>

    <h3>display: inline-flex</h3>
    <p>display inline-flex exibe os elementos em linha.</p>
    <div class="container-inline--flex">
    <div class="flex-child"></div>
    </div>

    <div class="container-inline--flex">
    <div class="flex-child"></div>
    </div>

    <div class="container-inline--flex">
    <div class="flex-child"></div>
    </div>
</body>
</html>
